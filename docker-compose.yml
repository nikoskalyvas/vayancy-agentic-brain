services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       vayancy
      POSTGRES_USER:     ${POSTGRES_USER:-vayancy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vayancy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MCP Servers — each a separate process on its own port ───────────────────

  mcp-webhotelier:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_WEBHOTELIER_PORT: "3001"
    ports:
      - "3001:3001"
    command: python -m app.mcp.webhotelier

  mcp-whatsapp:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_WHATSAPP_PORT: "3002"
    ports:
      - "3002:3002"
    command: python -m app.mcp.whatsapp

  mcp-pricelabs:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_PRICELABS_PORT: "3003"
    ports:
      - "3003:3003"
    command: python -m app.mcp.pricelabs

  mcp-epsilonnet:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_EPSILONNET_PORT: "3004"
    ports:
      - "3004:3004"
    command: python -m app.mcp.epsilonnet

  # ── Core API ─────────────────────────────────────────────────────────────────

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5

  # ── ARQ Worker ───────────────────────────────────────────────────────────────

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m arq app.queue.worker.WorkerSettings

  # ── Owner Dashboard ───────────────────────────────────────────────────────────

  dashboard:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL:     http://api:8000
        NEXT_PUBLIC_PROPERTY_ID: ${PROPERTY_ID:-default}
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data:
